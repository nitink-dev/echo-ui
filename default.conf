server {
    listen 3001;
    listen  [::]:3001;
    server_name  localhost;
 
    #access_log  /var/log/nginx/host.access.log  main;
 
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
 
    #error_page  404              /404.html;
 
    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
 
 
    # Proxy Grafana as same-origin to avoid cross-site cookie issues
    location /grafana/ {
        proxy_pass http://10.201.8.197:3000;
        # proxy_redirect / /grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
 
        # Proxy SAM Server as same-origin to avoid cross-site cookie issues
    location /sam/ {
        proxy_pass https://10.201.8.35/;
        proxy_ssl_verify off;
        proxy_redirect / /sam/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
 
                                                                             
        # Proxy Ibex as same-origin to avoid cross-site cookie issues      
    location /ibex/ {
#         return 200 "IBEX LOCATION HIT\n";
        proxy_pass https://endeavor.ibex-ai.com/;
        proxy_set_header Host endeavor.ibex-ai.com;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
 
        sub_filter_once off;
        sub_filter_types *;
 
        sub_filter 'src="/dist/'  'src="/ibex/dist/';
        sub_filter 'href="/dist/' 'href="/ibex/dist/';
#        sub_filter '"/ibex/api/'  '"/ibex/ibex/api/';
    }
 
    location /dist/ {
        proxy_pass https://endeavor.ibex-ai.com/dist/;
 
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
 
        proxy_set_header Host endeavor.ibex-ai.com;
    }
 
    location /ibex/dist/ {
        proxy_pass https://endeavor.ibex-ai.com/dist/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
 
        proxy_set_header Host endeavor.ibex-ai.com;
    }
 
   location /ibex/api/ {
       proxy_pass https://endeavor.ibex-ai.com/ibex/api/;
       proxy_ssl_verify off;
       proxy_ssl_server_name on;
 
       proxy_set_header Host endeavor.ibex-ai.com;
   }
 
    # Proxy Synapse Pathology as same-origin to avoid cross-site cookie issues
   location /synapse-pathology/ {                                             
        proxy_pass https://synapse.nsdev.tech/Omnyx.Web/;                     
        proxy_ssl_verify off;                                                 
        proxy_set_header Accept-Encoding "";                                  
        proxy_hide_header X-Frame-Options;                                    
        proxy_hide_header Content-Security-Policy;                            
        sub_filter_types *;                                                   
        sub_filter 'https://synapse.nsdev.tech/Omnyx.Web/' '/synapse-pathology/'; 
        sub_filter 'https://synapse.nsdev.tech/Omnyx.Proxy/' '/Omnyx.Proxy/';     
   }
   location /Omnyx.Web/ {                                                        
        proxy_pass https://synapse.nsdev.tech/Omnyx.Web/;                         
        proxy_ssl_verify off;                                                     
        proxy_set_header Host synapse.nsdev.tech;                                 
        proxy_set_header X-Real-IP $remote_addr;                                  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;              
        proxy_set_header X-Forwarded-Proto $scheme;                               
   }
    location /static/ {                                                       
        proxy_pass https://10.201.8.35/static/;                               
        proxy_ssl_verify off;                                                 
        proxy_set_header Host $host;                                          
        proxy_set_header X-Real-IP $remote_addr;                              
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;          
        proxy_set_header X-Forwarded-Proto $scheme;                           
    }
 
     location /dataserver/ {                                                   
        proxy_pass https://10.201.8.35/dataserver/;                           
        proxy_ssl_verify off;                                                 
        proxy_set_header Host $host;                                          
        proxy_set_header X-Real-IP $remote_addr;                              
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;          
        proxy_set_header X-Forwarded-Proto $scheme;                           
    }                                                                         

    location /Omnyx.Proxy/ {                                                      
        proxy_pass https://synapse.nsdev.tech/Omnyx.Proxy/;                       
        proxy_ssl_verify off;                                                     
        proxy_set_header Host synapse.nsdev.tech;                                 
        proxy_set_header X-Forwarded-Proto $scheme;                               
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;              
        proxy_set_header X-Real-IP $remote_addr;                                  
        proxy_hide_header Access-Control-Allow-Origin;                            
        add_header Access-Control-Allow-Origin * always;                          
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;      
        add_header Access-Control-Allow-Headers "*" always;                       
    }        
 
    location /webapi/ {
        proxy_pass https://endeavor.ibex-ai.com/webapi/;                           
        proxy_ssl_verify off;
        proxy_ssl_server_name on;                                                 
        proxy_set_header Host endeavor.ibex-ai.com;                                          
#        proxy_set_header X-Real-IP $remote_addr;                              
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;          
#        proxy_set_header X-Forwarded-Proto $scheme;  
    }              
 
}
